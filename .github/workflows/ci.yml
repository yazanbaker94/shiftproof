name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.2"
  CI: "true"

jobs:
  contracts-api:
    name: Contracts and API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            packages/contracts/package-lock.json
            apps/api/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix packages/contracts
          npm ci --prefix apps/api
      - name: Build contracts
        run: npm run contracts:build
      - name: Build API
        run: npm run api:build
      - name: Test API
        run: npm run api:test

  web:
    name: Web production build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --prefix apps/web
      - name: Build recruiter site and manager ledger
        run: npm run web:build
        env:
          NEXT_PUBLIC_SITE_URL: https://shiftproof.swoop.video
          NEXT_PUBLIC_API_BASE_URL: /api

  mobile:
    name: Mobile static verification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci --prefix apps/mobile
      - name: Typecheck
        run: npm run mobile:typecheck
      - name: Test durable storage and sync behavior
        run: npm run mobile:test
      - name: Validate Expo SDK compatibility
        run: npm run mobile:doctor

  production-images:
    name: Production container builds
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [contracts-api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate Compose configuration
        env:
          POSTGRES_PASSWORD: ci-only-not-for-production
          DATABASE_URL: postgresql://shiftproof:ci-only-not-for-production@db:5432/shiftproof
        run: docker compose -f infra/compose.yaml config --quiet
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          cache-from: type=gha,scope=shiftproof-api
          cache-to: type=gha,mode=max,scope=shiftproof-api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          cache-from: type=gha,scope=shiftproof-web
          cache-to: type=gha,mode=max,scope=shiftproof-web
