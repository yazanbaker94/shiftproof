name: Android reviewer APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.23.2"
  JAVA_VERSION: "17"
  CI: "true"

jobs:
  reviewer-apk:
    name: Build arm64 reviewer APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - run: npm ci --prefix apps/mobile
      - name: Verify mobile project
        run: |
          npm run mobile:typecheck
          npm run mobile:test
          npm run mobile:doctor
      - name: Build deterministic arm64 APK
        run: npm --prefix apps/mobile run android:reviewer:arm64
        env:
          EXPO_PUBLIC_API_URL: https://shiftproof.swoop.video/api
      - name: Write checksum
        working-directory: apps/mobile/dist/android
        run: sha256sum shiftproof-release-arm64-v8a.apk > shiftproof-release-arm64-v8a.apk.sha256
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiftproof-android-reviewer-arm64
          path: |
            apps/mobile/dist/android/shiftproof-release-arm64-v8a.apk
            apps/mobile/dist/android/shiftproof-release-arm64-v8a.apk.sha256
          if-no-files-found: error
          retention-days: 30

  tagged-release:
    name: Attach APK to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: reviewer-apk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shiftproof-android-reviewer-arm64
          path: release
      - name: Attach APK to tagged GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/shiftproof-release-arm64-v8a.apk
            release/shiftproof-release-arm64-v8a.apk.sha256
